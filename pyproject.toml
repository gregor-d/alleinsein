[project]
name = "alleine"
version = "2.5.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "titiler.core>=2.0.4",
    "uvicorn>=0.49.0",
    "pydantic-settings>=2.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["raster", "backend"]

[dependency-groups]
lint = [
    "commitizen>=4.0.0",
    "pre-commit>=4.0.0",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
    "ty>=0.0.46",
]
dev = [
    { include-group = "lint" },
    "osmnx>=2.1.0",
    "python-dotenv>=1.0.1",
    "gdal==3.13.1; sys_platform != 'win32'",
    "shapely>=2.1.2",
    "geopandas>=1.1.3",
    "pytest-playwright>=0.7.0",
    "playwright>=1.60.0",
]


[tool.pytest.ini_options]
addopts = "-s"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
    "RUF",
]

[tool.ty.src]
include = ["backend", "raster", "tests"]

[tool.ty.terminal]
output-format = "concise"

[tool.ty.rules]
unused-ignore-comment = "error"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
version_files = [
    "backend/_version.py:^__version__",
]
update_changelog_on_bump = true
